<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #281D82 0%, #1B1464 45%, #0B0826 85%, #040310 100%);
    font-family: 'Montserrat', sans-serif;
    color: #FAF9F6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 50px 45px 50px;
    text-align: center;
  }

  /* Top Section */
  .top-section {
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .emblem-top {
    width: 110px;
    filter: drop-shadow(0 6px 15px rgba(0,0,0,0.6));
    margin-bottom: 12px;
  }
  .title-small {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #FAF9F6;
  }
  .title-large {
    font-family: 'Playfair Display', serif;
    font-size: 74px;
    font-weight: 900;
    color: #F5D77F;
    letter-spacing: 1px;
    line-height: 1;
    margin-top: 5px;
    text-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }

  /* Handcrafted Arrow Pointer */
  .arrow-pointer {
    position: absolute;
    top: 240px;
    left: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 12;
  }
  .arrow-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 20px;
    color: #FAF9F6;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .arrow-svg {
    width: 80px;
    height: 90px;
  }

  /* Center Staged Table & Laptop */
  .table-stage {
    position: relative;
    width: 900px;
    height: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 15px;
  }

  /* Circular Velvet Table */
  .velvet-pedestal {
    position: absolute;
    bottom: 20px;
    width: 780px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 30%, #201760 0%, #150F44 50%, #0A0724 100%);
    border: 3px solid #A88A00;
    box-shadow: 0 35px 80px rgba(0,0,0,0.95);
    z-index: 2;
  }
  .table-glow {
    position: absolute;
    bottom: -10px;
    width: 860px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(168, 138, 0, 0.35) 0%, transparent 70%);
    filter: blur(30px);
    z-index: 1;
  }

  /* Modern Laptop Frame */
  .laptop-container {
    position: relative;
    width: 660px;
    height: 440px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 30px 50px rgba(0,0,0,0.85));
    transform: translateY(-20px);
  }

  /* Laptop Screen */
  .laptop-lid {
    width: 580px;
    height: 380px;
    background: #121318;
    border: 10px solid #1E2028;
    border-radius: 16px 16px 4px 4px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
  }
  .laptop-camera {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    background: #333;
    border-radius: 50%;
    z-index: 10;
  }

  /* Website Mockup On Screen */
  .screen-content {
    width: 100%;
    height: 100%;
    background: #FAF9F6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
  }
  .browser-bar {
    height: 24px;
    background: #E8E7E0;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    border-bottom: 1px solid #D0CECA;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.red { background: #FF5F56; }
  .dot.yellow { background: #FFBD2E; }
  .dot.green { background: #27C93F; }
  .url-bar {
    margin-left: 15px;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 2px 14px;
    font-size: 9px;
    color: #1B1464;
    font-weight: 700;
  }

  .website-body {
    flex: 1;
    display: flex;
    background: #FAF9F6;
    position: relative;
  }
  .web-left {
    flex: 1.1;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
  }
  .web-logo {
    width: 130px;
    margin-bottom: 8px;
  }
  .web-headline {
    font-size: 13px;
    font-weight: 800;
    color: #1B1464;
    line-height: 1.25;
    margin-bottom: 6px;
  }
  .web-sub {
    font-size: 8.5px;
    color: #6A6A78;
    line-height: 1.35;
    margin-bottom: 10px;
  }
  .web-btn {
    background: #1B1464;
    color: #FAF9F6;
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 7.5px;
    font-weight: 700;
    letter-spacing: 1px;
    width: fit-content;
  }

  /* Laptop Base */
  .laptop-base {
    width: 660px;
    height: 16px;
    background: linear-gradient(to bottom, #A0A4AE, #6D727D);
    border-radius: 2px 2px 10px 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    position: relative;
  }
  .laptop-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 5px;
    background: #4B4E56;
    border-radius: 0 0 5px 5px;
  }

  /* Gold Silk Draped Over Corner */
  .golden-silk-drape {
    position: absolute;
    top: -20px;
    right: 20px;
    width: 170px;
    height: 410px;
    background: linear-gradient(135deg, #F9E79F 0%, #D4AF37 40%, #A88A00 70%, #5C4600 100%);
    border-radius: 40px 100px 30px 120px;
    transform: rotate(14deg);
    z-index: 10;
    box-shadow: -12px 15px 30px rgba(0,0,0,0.65), inset 2px 2px 10px rgba(255,255,255,0.6);
  }
  .silk-fold-line {
    position: absolute;
    top: 40px;
    right: 30px;
    width: 25px;
    height: 320px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent, rgba(0,0,0,0.4));
    border-radius: 15px;
  }

  /* Bottom Pill Bar */
  .bottom-bar-container {
    z-index: 10;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pill-bar {
    background: #0A081E;
    border: 2px solid #F5D77F;
    border-radius: 60px;
    padding: 16px 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 25px rgba(245, 215, 127, 0.25);
    margin-bottom: 14px;
  }
  .pill-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: 800;
    color: #FAF9F6;
    letter-spacing: 1.5px;
  }
  .pill-item span {
    color: #F5D77F;
  }
  .pill-divider {
    width: 2px;
    height: 28px;
    background: #A88A00;
  }

  .bottom-address {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #A0A0BA;
    font-weight: 600;
  }
</style>
