<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 25%, #241A78 0%, #16104F 40%, #0A0822 80%, #040310 100%);
    font-family: 'Montserrat', sans-serif;
    color: #FAF9F6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 60px 60px 60px;
    text-align: center;
  }

  /* Top Typography */
  .top-section {
    z-index: 10;
  }
  .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #D4AF37;
    margin-bottom: 12px;
  }
  .launching-title {
    font-family: 'Playfair Display', serif;
    font-size: 86px;
    font-weight: 700;
    color: #FAF9F6;
    letter-spacing: 8px;
    line-height: 0.95;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .launching-title .italic-soon {
    font-style: italic;
    color: #F5D77F;
    font-weight: 400;
    letter-spacing: 2px;
  }

  /* Center Stage & Pedestal */
  .stage-container {
    position: relative;
    width: 780px;
    height: 580px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }

  /* Spotlight Glow from Top */
  .spotlight-beam {
    position: absolute;
    top: -120px;
    width: 500px;
    height: 600px;
    background: radial-gradient(ellipse at 50% 0%, rgba(245, 215, 127, 0.22) 0%, rgba(27, 20, 100, 0) 70%);
    filter: blur(20px);
    z-index: 1;
    pointer-events: none;
  }

  /* Pedestal Disc Base */
  .pedestal-base {
    position: absolute;
    bottom: 25px;
    width: 620px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 30%, #30267E 0%, #1B1464 45%, #0A0826 80%, #03020A 100%);
    border: 3px solid #A88A00;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9), inset 0 2px 10px rgba(245, 215, 127, 0.6);
    z-index: 2;
  }
  .pedestal-glow {
    position: absolute;
    bottom: 10px;
    width: 700px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(168, 138, 0, 0.35) 0%, transparent 70%);
    filter: blur(25px);
    z-index: 1;
  }

  /* Official Crest Emblem in Center */
  .monolith-crest {
    position: relative;
    width: 320px;
    z-index: 5;
    filter: drop-shadow(0 25px 35px rgba(0,0,0,0.9)) drop-shadow(0 0 40px rgba(168, 138, 0, 0.4));
    transform: translateY(-40px);
  }

  /* Flowing Royal Silk Drape on Right Side */
  .silk-drape-overlay {
    position: absolute;
    top: 70px;
    right: 200px;
    width: 170px;
    height: 380px;
    background: linear-gradient(135deg, rgba(168, 138, 0, 0.95) 0%, rgba(212, 175, 55, 0.9) 35%, rgba(138, 105, 0, 0.85) 70%, rgba(60, 45, 0, 0.7) 100%);
    border-radius: 120px 10px 80px 20px;
    transform: rotate(18deg) skewY(-10deg);
    box-shadow: -15px 15px 30px rgba(0,0,0,0.6), inset 2px 2px 15px rgba(255,255,255,0.4);
    z-index: 6;
  }
  .silk-fold {
    position: absolute;
    top: 40px;
    right: 20px;
    width: 25px;
    height: 280px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent, rgba(0,0,0,0.4));
    border-radius: 20px;
  }

  /* Bottom Launch Card & Domain */
  .bottom-section {
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .date-ribbon {
    display: flex;
    align-items: center;
    gap: 15px;
    font-family: 'Cinzel', serif;
    font-size: 19px;
    letter-spacing: 5px;
    color: #FAF9F6;
    margin-bottom: 22px;
    text-transform: uppercase;
  }
  .date-ribbon .line {
    width: 60px;
    height: 1.5px;
    background: #A88A00;
  }

  .domain-pill {
    background: linear-gradient(135deg, #1B1464 0%, #0A0826 100%);
    border: 2px solid #F5D77F;
    padding: 18px 48px;
    border-radius: 60px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 25px rgba(245, 215, 127, 0.3);
    margin-bottom: 20px;
  }
  .domain-pill span {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #FFFFFF;
  }
  .domain-pill span b {
    color: #F5D77F;
  }

  .tagline-sub {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #A0A0BA;
    font-weight: 600;
  }
</style>
</head>
